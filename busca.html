<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Linx - Pesquisa de Referência</title>
    <!-- Biblioteca para ler Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-gray: #e0e0e0;
            --white: #ffffff;
            --black: #000000;
            --border: #000000;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .search-container {
            background-color: var(--bg-gray);
            border: 2px solid var(--border);
            width: 800px;
            padding: 20px;
        }

        /* Topo da busca */
        .search-header {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .box {
            border: 1px solid var(--border);
            background: var(--white);
            text-align: center;
        }

        .label-black {
            background: var(--black);
            color: var(--white);
            padding: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .label-white {
            background: var(--white);
            color: var(--black);
            padding: 5px;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        .input-area {
            padding: 15px;
        }

        input {
            width: 80%;
            border: none;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        /* Tabela de Resultados */
        .result-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
        }

        .result-table td {
            border: 1px solid var(--border);
            padding: 12px;
            font-size: 18px;
        }

        .field-label {
            width: 150px;
            text-transform: uppercase;
        }

        .field-value {
            font-weight: bold;
            text-align: right;
        }

        /* Upload */
        .upload-section {
            margin-top: 20px;
            font-size: 12px;
            border-top: 1px dashed #999;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="search-container">
    <div class="search-header">
        <div class="box">
            <div class="label-white">BASE LINX</div>
            <div class="label-black">PESQUISAR REF:</div>
        </div>
        <div class="box">
            <div class="label-white">REFERÊNCIA</div>
            <div class="input-area">
                <input type="text" id="refInput" placeholder="0000" oninput="buscarRef()">
            </div>
        </div>
    </div>

    <table class="result-table">
        <tr>
            <td class="field-label">TECIDO:</td>
            <td class="field-value" id="res-tecido">-</td>
        </tr>
        <tr>
            <td class="field-label">SEMANA:</td>
            <td class="field-value" id="res-semana">-</td>
        </tr>
        <tr>
            <td class="field-label">DESCRIÇÃO:</td>
            <td class="field-value" id="res-descricao">-</td>
        </tr>
        <tr>
            <td class="field-label">COLEÇÃO:</td>
            <td class="field-value" id="res-colecao">-</td>
        </tr>
    </table>

    <div class="upload-section">
        <label>Carregar Planilha Excel: </label>
        <input type="file" id="uploadExcel" accept=".xlsx, .xls" style="font-size: 12px; width: auto;">
    </div>
</div>

<script>
    let bancoDados = [];

    // Função para ler o arquivo Excel
    document.getElementById('uploadExcel').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();

        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Converte para JSON
            bancoDados = XLSX.utils.sheet_to_json(worksheet);
            alert("Planilha carregada com sucesso! " + bancoDados.length + " itens encontrados.");
        };

        reader.readAsArrayBuffer(file);
    });

    // Função de busca
    function buscarRef() {
        const query = document.getElementById('refInput').value.trim();
        
        if (query === "" || bancoDados.length === 0) {
            limparCampos();
            return;
        }

        // Procura na coluna 'REF' (ajuste o nome se for diferente na sua planilha)
        const resultado = bancoDados.find(item => 
            String(item.REF).toLowerCase() === query.toLowerCase() ||
            String(item.Referencia).toLowerCase() === query.toLowerCase()
        );

        if (resultado) {
            document.getElementById('res-tecido').innerText = resultado.TECIDO || resultado.Tecido || "-";
            document.getElementById('res-semana').innerText = resultado.SEMANA || resultado.Semana || "-";
            document.getElementById('res-descricao').innerText = resultado.DESCRICAO || resultado.Descricao || "-";
            document.getElementById('res-colecao').innerText = resultado.COLECAO || resultado.Colecao || "-";
        } else {
            limparCampos();
        }
    }

    function limparCampos() {
        document.getElementById('res-tecido').innerText = "-";
        document.getElementById('res-semana').innerText = "-";
        document.getElementById('res-descricao').innerText = "-";
        document.getElementById('res-colecao').innerText = "-";
    }
</script>

</body>
</html>
